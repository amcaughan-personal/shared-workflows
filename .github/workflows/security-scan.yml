name: security-scan

# Runs the selected scans (checkov, trivy, gitleaks, actionlint; all by default), combines
# their SARIF output into one HTML report, and comments on the PR when there are findings.
#
#   jobs:
#     security:
#       uses: amcaughan-personal/shared_workflows/.github/workflows/security-scan.yml@<commit sha on main>
#       permissions:
#         contents: read
#         pull-requests: write   # for the PR comment
#       with:
#         scans: "trivy, gitleaks, actionlint"   # e.g. no infrastructure code, so no checkov

on:
  workflow_call:
    inputs:
      scans:
        description: "Comma-separated scans to run: checkov (infrastructure code), trivy, gitleaks, actionlint"
        type: string
        required: false
        default: "checkov, trivy, gitleaks, actionlint"
      scan_path:
        description: "Path to scan with checkov and trivy"
        type: string
        required: false
        default: "."
      trivy_scanners:
        description: "Comma-separated trivy scanners"
        type: string
        required: false
        default: "vuln,license"
      scan_git_history:
        description: "Scan full git history with gitleaks (slower)"
        type: boolean
        required: false
        default: true
      checkov_fail_on_findings:
        description: "Fail when Checkov reports a finding (skip deliberate ones inline)"
        type: boolean
        required: false
        default: true
      trivy_fail_on_severity:
        description: "Fail on fixable vulnerabilities of these severities (empty: report only)"
        type: string
        required: false
        default: "HIGH,CRITICAL"
      comment_when_clean:
        description: "Also comment when there are no findings (by default only an existing comment is updated)"
        type: boolean
        required: false
        default: false
      report_title:
        description: "Title of the combined report"
        type: string
        required: false
        default: "Repo security report"

permissions:
  contents: read

jobs:
  # Turn the scans list into one flag per scan; an unknown name fails rather than
  # silently skipping a scan.
  select:
    runs-on: ubuntu-latest
    outputs:
      checkov: ${{ steps.select.outputs.checkov }}
      trivy: ${{ steps.select.outputs.trivy }}
      gitleaks: ${{ steps.select.outputs.gitleaks }}
      actionlint: ${{ steps.select.outputs.actionlint }}
    steps:
      - id: select
        env:
          SCANS: ${{ inputs.scans }}
        run: |
          known="checkov trivy gitleaks actionlint"
          selected=" $(echo "$SCANS" | tr ',' ' ' | xargs) "
          for scan in $selected; do
            case " $known " in
              *" $scan "*) ;;
              *) echo "::error::Unknown scan '$scan' (known: $known)"; exit 1 ;;
            esac
          done
          for scan in $known; do
            case "$selected" in
              *" $scan "*) echo "$scan=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "$scan=false" >> "$GITHUB_OUTPUT" ;;
            esac
          done

  checkov:
    needs: select
    if: ${{ needs.select.outputs.checkov == 'true' }}
    uses: ./.github/workflows/scan-checkov.yml
    with:
      scan_path: ${{ inputs.scan_path }}
      fail_on_findings: ${{ inputs.checkov_fail_on_findings }}

  trivy:
    needs: select
    if: ${{ needs.select.outputs.trivy == 'true' }}
    uses: ./.github/workflows/scan-trivy.yml
    with:
      scan_path: ${{ inputs.scan_path }}
      scanners: ${{ inputs.trivy_scanners }}
      fail_on_severity: ${{ inputs.trivy_fail_on_severity }}

  gitleaks:
    needs: select
    if: ${{ needs.select.outputs.gitleaks == 'true' }}
    uses: ./.github/workflows/scan-gitleaks.yml
    with:
      redact: true
      scan_history: ${{ inputs.scan_git_history }}

  actionlint:
    needs: select
    if: ${{ needs.select.outputs.actionlint == 'true' }}
    uses: ./.github/workflows/scan-actionlint.yml

  report:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [checkov, trivy, gitleaks, actionlint]
    permissions:
      contents: read
      pull-requests: write

    steps:
      # The report actions live in this repo, at the commit this workflow runs from.
      - name: Checkout shared_workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows

      - name: Download SARIF artifacts
        uses: actions/download-artifact@v8
        with:
          path: sarif

      - name: Build HTML report
        uses: ./.shared-workflows/.github/actions/sarif-report
        with:
          title: ${{ inputs.report_title }}
          sarif_glob: "sarif/**/*.sarif"
          out_html: out/security-report.html

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: out/security-report.html
          retention-days: 14

      - name: Attach report to step summary
        run: |
          {
            echo "<details open><summary>Security report</summary>"
            cat out/security-report.html
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Count findings
        id: count
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json
          total = 0
          for path in glob.glob("sarif/**/*.sarif", recursive=True):
              with open(path) as fh:
                  for run in json.load(fh).get("runs", []):
                      # Results skipped on purpose (inline, with a reason) aren't findings.
                      total += sum(1 for r in run.get("results", []) if not r.get("suppressions"))
          print(f"findings={total}")
          PY

      - name: Build PR comment
        if: ${{ github.event_name == 'pull_request' && (steps.count.outputs.findings != '0' || inputs.comment_when_clean) }}
        env:
          TITLE: ${{ inputs.report_title }}
        run: |
          {
            echo "## $TITLE"
            echo ""
            echo "<details open><summary>Report</summary>"
            echo ""
            cat out/security-report.html
            echo ""
            echo "</details>"
          } > out/pr-comment.md

      - name: Comment on PR (updated in place)
        if: ${{ github.event_name == 'pull_request' && (steps.count.outputs.findings != '0' || inputs.comment_when_clean) }}
        uses: ./.shared-workflows/.github/actions/comment-pr
        with:
          comment_name: security-report
          body_file: out/pr-comment.md
          token: ${{ secrets.GITHUB_TOKEN }}

      # Clean run: don't start a new comment, but fix up one left by an earlier run so it
      # doesn't keep showing findings that are gone.
      - name: Mark an earlier comment as resolved
        if: ${{ github.event_name == 'pull_request' && steps.count.outputs.findings == '0' && !inputs.comment_when_clean }}
        env:
          TITLE: ${{ inputs.report_title }}
        run: |
          mkdir -p out
          printf '## %s\n\nNo findings: everything reported earlier on this PR is fixed.\n' "$TITLE" > out/pr-comment-clean.md

      - name: Update earlier comment, if any
        if: ${{ github.event_name == 'pull_request' && steps.count.outputs.findings == '0' && !inputs.comment_when_clean }}
        uses: ./.shared-workflows/.github/actions/comment-pr
        with:
          comment_name: security-report
          body_file: out/pr-comment-clean.md
          mode: update
          token: ${{ secrets.GITHUB_TOKEN }}
