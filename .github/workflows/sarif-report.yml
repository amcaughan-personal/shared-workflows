name: sarif-report

on:
  workflow_call:
    inputs:
      title:
        description: "HTML report title"
        type: string
        required: false
        default: "Security Report"

      sarif_glob:
        description: "Glob for SARIF files after artifact download"
        type: string
        required: false
        default: "sarif/**/**/*.sarif"

      out_html:
        description: "Output HTML path"
        type: string
        required: false
        default: "out/security-report.html"

      report_artifact_name:
        description: "Artifact name for generated HTML report"
        type: string
        required: false
        default: "security-report"

      retention_days:
        description: "Artifact retention period"
        type: number
        required: false
        default: 14

      summary_open:
        description: "Whether the Step Summary <details> is open by default"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    # A scan normally takes under a minute; a hung one fails here instead of after six hours.
    timeout-minutes: 15
    if: ${{ always() }}

    steps:
      - name: Download SARIF artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: sarif

      # The report actions live in this repo, at the commit this workflow runs from.
      - name: Checkout shared-workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows

      - name: Generate SARIF HTML report
        uses: ./.shared-workflows/.github/actions/sarif-report
        with:
          title: ${{ inputs.title }}
          sarif_glob: ${{ inputs.sarif_glob }}
          out_html: ${{ inputs.out_html }}

      - name: Upload HTML report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.report_artifact_name }}
          path: ${{ inputs.out_html }}
          retention-days: ${{ inputs.retention_days }}

      - name: Attach report to Step Summary
        shell: bash
        run: |
          if [[ "${{ inputs.summary_open }}" == "true" ]]; then
            open_attr="open"
          else
            open_attr=""
          fi

          {
            echo "<details $open_attr><summary>Security report (HTML)</summary>"
            cat "${{ inputs.out_html }}"
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
