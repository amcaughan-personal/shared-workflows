name: security-checkov

on:
  workflow_call:
    inputs:
      scan_path:
        description: "Path to scan (repo root is '.')"
        type: string
        required: false
        default: "."
      python_version:
        description: "Python version for Checkov"
        type: string
        required: false
        default: "3.12"
      artifact_name:
        description: "Artifact name for SARIF output"
        type: string
        required: false
        default: "sarif-checkov"
      sarif_filename:
        description: "SARIF filename (within out/)"
        type: string
        required: false
        default: "checkov.sarif"
      checkov_version:
        description: "Checkov version (pinned so new rules arrive when you choose, not at random)"
        type: string
        required: false
        default: "3.4.3"
      checkov_args:
        description: "Extra args passed to checkov"
        type: string
        required: false
        default: ""
      fail_on_findings:
        description: "Fail the job if Checkov finds violations"
        type: boolean
        required: false
        default: false
    outputs:
      artifact_name:
        description: "Artifact containing SARIF"
        value: ${{ jobs.checkov.outputs.artifact_name }}
      sarif_path:
        description: "Path to SARIF file in the job workspace"
        value: ${{ jobs.checkov.outputs.sarif_path }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  checkov:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.out.outputs.artifact_name }}
      sarif_path: ${{ steps.out.outputs.sarif_path }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ inputs.python_version }}-checkov-${{ inputs.checkov_version }}
          restore-keys: |
            pip-${{ runner.os }}-${{ inputs.python_version }}-
            pip-${{ runner.os }}-

      - name: Install Checkov
        shell: bash
        env:
          CHECKOV_VERSION: ${{ inputs.checkov_version }}
        run: |
          python -m pip install --upgrade pip
          pip install "checkov==$CHECKOV_VERSION"

      - name: Run Checkov (SARIF)
        id: run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          set +e
          checkov -d "${{ inputs.scan_path }}" \
          -o sarif \
          --output-file-path "out/${{ inputs.sarif_filename }}" \
          ${{ inputs.checkov_args }}
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"


      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: out/${{ inputs.sarif_filename }}
          if-no-files-found: error
          retention-days: 14

      - name: Expose outputs
        id: out
        shell: bash
        run: |
          echo "artifact_name=${{ inputs.artifact_name }}" >> "$GITHUB_OUTPUT"
          echo "sarif_path=out/${{ inputs.sarif_filename }}" >> "$GITHUB_OUTPUT"
    
      - name: Fail if findings (optional)
        if: ${{ inputs.fail_on_findings }}
        shell: bash
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        run: exit "$EXIT_CODE"
