name: security-checkov

on:
  workflow_call:
    inputs:
      scan_path:
        description: "Path to scan (repo root is '.')"
        type: string
        required: false
        default: "."
      artifact_name:
        description: "Artifact name for SARIF output"
        type: string
        required: false
        default: "sarif-checkov"
      sarif_filename:
        description: "SARIF filename (within out/)"
        type: string
        required: false
        default: "checkov.sarif"
      checkov_image:
        description: "Checkov image to run instead of the pinned one in .github/images/checkov/Dockerfile"
        type: string
        required: false
        default: ""
      checkov_args:
        description: "Extra args passed to checkov"
        type: string
        required: false
        default: ""
      fail_on_findings:
        description: "Fail the job if Checkov finds violations"
        type: boolean
        required: false
        default: false
    outputs:
      artifact_name:
        description: "Artifact containing SARIF"
        value: ${{ jobs.checkov.outputs.artifact_name }}
      sarif_path:
        description: "Path to SARIF file in the job workspace"
        value: ${{ jobs.checkov.outputs.sarif_path }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  checkov:
    runs-on: ubuntu-latest
    # A scan normally takes under a minute; a hung one fails here instead of after six hours.
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.out.outputs.artifact_name }}
      sarif_path: ${{ steps.out.outputs.sarif_path }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pinned image lives in this repo (so Dependabot can update it), at the commit
      # this workflow runs from.
      - name: Read the pinned Checkov image
        id: image
        if: ${{ inputs.checkov_image == '' }}
        env:
          REPO: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          image=$(gh api "repos/$REPO/contents/.github/images/checkov/Dockerfile?ref=$SHA" \
            -H "Accept: application/vnd.github.raw" | awk '/^FROM /{print $2}')
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Run Checkov (SARIF)
        id: run
        shell: bash
        env:
          IMAGE: ${{ inputs.checkov_image || steps.image.outputs.image }}
          SCAN_PATH: ${{ inputs.scan_path }}
          SARIF: out/${{ inputs.sarif_filename }}
          EXTRA_ARGS: ${{ inputs.checkov_args }}
        run: |
          set -euo pipefail
          mkdir -p out
          set +e
          # shellcheck disable=SC2086 # EXTRA_ARGS is a space-separated list of flags
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo" -w /repo "$IMAGE" \
            -d "$SCAN_PATH" -o sarif --output-file-path "$SARIF" $EXTRA_ARGS
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: out/${{ inputs.sarif_filename }}
          if-no-files-found: error
          retention-days: 14

      - name: Expose outputs
        id: out
        shell: bash
        run: |
          echo "artifact_name=${{ inputs.artifact_name }}" >> "$GITHUB_OUTPUT"
          echo "sarif_path=out/${{ inputs.sarif_filename }}" >> "$GITHUB_OUTPUT"
    
      - name: Fail if findings (optional)
        if: ${{ inputs.fail_on_findings }}
        shell: bash
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        run: exit "$EXIT_CODE"
