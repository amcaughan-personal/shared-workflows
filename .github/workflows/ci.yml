name: ci

# Checks for this repo itself (lint, security scan, unit tests); the other workflows
# here are reusable (workflow_call).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    uses: ./.github/workflows/scan-actionlint.yml

  security:
    uses: ./.github/workflows/security-scan.yml
    permissions:
      contents: read
      pull-requests: write

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -v
