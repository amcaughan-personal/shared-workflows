name: format-check

on:
  workflow_call:
    inputs:
      terraform_modules_dir:
        description: "Directory containing Terraform modules to fmt-check"
        type: string
        required: false
        default: "infra/terragrunt/modules"
      terragrunt_working_dir:
        description: "Directory containing Terragrunt HCL to fmt-check"
        type: string
        required: false
        default: "infra/terragrunt"
      terraform_version:
        description: "Terraform version to install"
        type: string
        required: false
        default: "1.14.2"  # keep in step with the local dev images
      terragrunt_version:
        description: "Terragrunt version to install"
        type: string
        required: false
        default: "v0.94.0"
      run_bash_syntax_check:
        description: "Run bash -n against tracked .sh files"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gruntwork-io/terragrunt/releases/download/${{ inputs.terragrunt_version }}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Terraform fmt check (modules)
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive "${{ inputs.terraform_modules_dir }}"

      - name: Terragrunt hcl format check
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ inputs.terragrunt_working_dir }}"
          terragrunt hcl format --check

      - name: Bash syntax check
        if: ${{ inputs.run_bash_syntax_check }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(git ls-files | grep -E '\.sh$' || true)

          if (( ${#shell_files[@]} == 0 )); then
            echo "No tracked .sh files found"
            exit 0
          fi

          while IFS= read -r shell_file; do
            [[ -n "$shell_file" ]] || continue
            bash -n "$shell_file"
          done < <(printf '%s\n' "${shell_files[@]}" | sort -u)
