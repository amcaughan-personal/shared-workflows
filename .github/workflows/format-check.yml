name: format-check

on:
  workflow_call:
    inputs:
      terraform_modules_dir:
        description: "Directory containing Terraform modules to fmt-check"
        type: string
        required: false
        default: "infra/terragrunt/modules"
      terragrunt_working_dir:
        description: "Directory containing Terragrunt HCL to fmt-check"
        type: string
        required: false
        default: "infra/terragrunt"
      terraform_version:
        description: "Terraform version to install (default: from the repo's .tool-versions)"
        type: string
        required: false
        default: ""
      terragrunt_version:
        description: "Terragrunt version to install, e.g. 1.2.2 (default: from the repo's .tool-versions)"
        type: string
        required: false
        default: ""
      run_bash_syntax_check:
        description: "Run bash -n against tracked .sh files"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The repo's .tool-versions is the one place versions are set; its dev image and
      # root.hcl read the same file, so local runs and CI always match.
      - name: Read tool versions
        id: versions
        env:
          TERRAFORM: ${{ inputs.terraform_version }}
          TERRAGRUNT: ${{ inputs.terragrunt_version }}
        run: |
          set -euo pipefail
          from_file() { awk -v tool="$1" '$1 == tool {print $2}' .tool-versions 2>/dev/null || true; }
          terraform=${TERRAFORM:-$(from_file terraform)}
          terragrunt=${TERRAGRUNT:-$(from_file terragrunt)}
          if [[ -z "$terraform" || -z "$terragrunt" ]]; then
            echo "::error::Set terraform and terragrunt in .tool-versions (or pass the inputs)"
            exit 1
          fi
          echo "terraform=$terraform" >> "$GITHUB_OUTPUT"
          echo "terragrunt=${terragrunt#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        shell: bash
        env:
          VERSION: ${{ steps.versions.outputs.terragrunt }}
        run: |
          set -euo pipefail
          base="https://github.com/gruntwork-io/terragrunt/releases/download/v${VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/terragrunt_linux_amd64"
          curl -fsSLO "$base/SHA256SUMS"
          grep " terragrunt_linux_amd64\$" SHA256SUMS | sha256sum -c -
          install -m 0755 terragrunt_linux_amd64 /usr/local/bin/terragrunt
          terragrunt --version

      - name: Terraform fmt check (modules)
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive "${{ inputs.terraform_modules_dir }}"

      - name: Terragrunt hcl format check
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ inputs.terragrunt_working_dir }}"
          terragrunt hcl format --check

      - name: Bash syntax check
        if: ${{ inputs.run_bash_syntax_check }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(git ls-files | grep -E '\.sh$' || true)

          if (( ${#shell_files[@]} == 0 )); then
            echo "No tracked .sh files found"
            exit 0
          fi

          while IFS= read -r shell_file; do
            [[ -n "$shell_file" ]] || continue
            bash -n "$shell_file"
          done < <(printf '%s\n' "${shell_files[@]}" | sort -u)
