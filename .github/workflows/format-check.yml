name: format-check

on:
  workflow_call:
    inputs:
      terraform_modules_dir:
        description: "Directory containing Terraform modules to fmt-check"
        type: string
        required: false
        default: "infra/terragrunt/modules"
      terragrunt_working_dir:
        description: "Directory containing Terragrunt HCL to fmt-check"
        type: string
        required: false
        default: "infra/terragrunt"
      terraform_version:
        description: "Terraform version to install (default: from the repo's .tool-versions)"
        type: string
        required: false
        default: ""
      terragrunt_version:
        description: "Terragrunt version to install, e.g. 1.2.2 (default: from the repo's .tool-versions)"
        type: string
        required: false
        default: ""
      run_bash_syntax_check:
        description: "Run bash -n against tracked .sh files"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-terragrunt lives in this repo, at the commit this workflow runs from.
      - name: Checkout shared-workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows

      - name: Setup Terraform and Terragrunt
        uses: ./.shared-workflows/.github/actions/setup-terragrunt
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terragrunt_version: ${{ inputs.terragrunt_version }}

      - name: Terraform fmt check (modules)
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive "${{ inputs.terraform_modules_dir }}"

      - name: Terragrunt hcl format check
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ inputs.terragrunt_working_dir }}"
          terragrunt hcl format --check

      - name: Bash syntax check
        if: ${{ inputs.run_bash_syntax_check }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(git ls-files | grep -E '\.sh$' || true)

          if (( ${#shell_files[@]} == 0 )); then
            echo "No tracked .sh files found"
            exit 0
          fi

          while IFS= read -r shell_file; do
            [[ -n "$shell_file" ]] || continue
            bash -n "$shell_file"
          done < <(printf '%s\n' "${shell_files[@]}" | sort -u)
