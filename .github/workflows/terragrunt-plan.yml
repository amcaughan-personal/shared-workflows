name: terragrunt-plan

# Read-only `terragrunt plan` of every stack in a repo, for pull requests in public repos, or
# on a schedule with fail_on_changes as a drift check.
# Plan output stays on the runner: the PR comment and step summary list resource addresses
# and types only, and the job log shows only Terraform's one-line error summaries, with the
# AWS account ID masked. Nothing is uploaded.

on:
  workflow_call:
    inputs:
      terragrunt_working_dir:
        description: "Directory searched for Terragrunt stacks (each terragrunt.hcl below it is planned)"
        type: string
        required: false
        default: "infra/terragrunt"
      aws_region:
        description: "AWS region for the OIDC credentials"
        type: string
        required: true
      report_title:
        description: "Title of the PR comment and step summary"
        type: string
        required: false
        default: "Terragrunt plan"
      fail_on_changes:
        description: "Fail if any stack has changes, e.g. for a scheduled drift check: AWS no longer matches the code on the branch"
        type: boolean
        required: false
        default: false
      terraform_version:
        description: "Terraform version (default: from the repo's .tool-versions)"
        type: string
        required: false
        default: ""
      terragrunt_version:
        description: "Terragrunt version, e.g. 1.2.2 (default: from the repo's .tool-versions)"
        type: string
        required: false
        default: ""
    secrets:
      aws_role_arn:
        description: "Read-only plan role to assume via GitHub OIDC (a secret, so its account ID is masked)"
        required: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    # Dependabot's runs get no repo secrets (so no plan role), and it only bumps pinned
    # versions, never infrastructure: nothing to plan.
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-terragrunt lives in this repo, at the commit this workflow runs from.
      - name: Checkout shared-workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows

      - name: Setup Terraform and Terragrunt
        uses: ./.shared-workflows/.github/actions/setup-terragrunt
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terragrunt_version: ${{ inputs.terragrunt_version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          # CloudTrail records this name, so each AWS change leads back to its workflow run.
          role-session-name: gha-terragrunt-plan-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true

      # Full output goes to a file on the runner, never to the log. A failed stack logs only
      # Terraform's one-line "Error:" summaries, with any 12-digit number redacted.
      - name: Plan every stack
        id: plan
        env:
          WORKING_DIR: ${{ inputs.terragrunt_working_dir }}
          TG_NON_INTERACTIVE: "true"
          TG_NO_COLOR: "true"
          TF_IN_AUTOMATION: "true"
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugins
        run: |
          set -uo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          status=0
          # No state locks: a plan changes nothing, and a run cancelled by a newer push would
          # leave its lock behind, blocking the next plan or apply.
          bash .shared-workflows/.github/scripts/plan-stacks.sh "$WORKING_DIR" "$RUNNER_TEMP/terragrunt-plans" -lock=false || status=$?
          if (( status == 2 )); then exit 1; fi
          echo "failed=$(( status ? 1 : 0 ))" >> "$GITHUB_OUTPUT"

      - name: Build report
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        uses: ./.shared-workflows/.github/actions/terragrunt-plan-report
        with:
          title: ${{ inputs.report_title }}
          plan_index_tsv: ${{ runner.temp }}/terragrunt-plans/index.tsv
          out_markdown: ${{ runner.temp }}/terragrunt-plan.md

      - name: Fail on changes
        id: changes
        if: ${{ !cancelled() && inputs.fail_on_changes && steps.plan.outcome == 'success' }}
        run: |
          set -euo pipefail
          mapfile -t plans < <(cut -f3 "$RUNNER_TEMP/terragrunt-plans/index.tsv" | grep . || true)
          changes=0
          if (( ${#plans[@]} )); then
            changes=$(jq -s 'map([.resource_changes[]? | select(.change.actions != ["no-op"] and .change.actions != ["read"])] | length) | add' "${plans[@]}")
          fi
          echo "changes=$changes" >> "$GITHUB_OUTPUT"

      - name: Remove plan files
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/terragrunt-plans"

      - name: Step summary
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        run: cat "$RUNNER_TEMP/terragrunt-plan.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && github.event_name == 'pull_request' }}
        uses: ./.shared-workflows/.github/actions/comment-pr
        with:
          comment_name: terragrunt-plan
          body_file: ${{ runner.temp }}/terragrunt-plan.md
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if any stack failed to plan
        if: ${{ steps.plan.outputs.failed == '1' }}
        run: exit 1

      - name: Fail if anything would change
        if: ${{ steps.changes.outputs.changes != '' && steps.changes.outputs.changes != '0' }}
        env:
          CHANGES: ${{ steps.changes.outputs.changes }}
        run: |
          echo "::error::$CHANGES resource change(s): AWS doesn't match the code on $GITHUB_REF_NAME (drift, or a change not applied yet). The summary lists them."
          exit 1
