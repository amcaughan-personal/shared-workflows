name: terragrunt-plan

# Read-only `terragrunt plan` of every stack in a repo, for pull requests in public repos.
# Plan output stays on the runner: the PR comment and step summary list resource addresses
# and types only, and the job log shows only Terraform's one-line error summaries, with the
# AWS account ID masked. Nothing is uploaded.

on:
  workflow_call:
    inputs:
      terragrunt_working_dir:
        description: "Directory searched for Terragrunt stacks (each terragrunt.hcl below it is planned)"
        type: string
        required: false
        default: "infra/terragrunt"
      aws_region:
        description: "AWS region for the OIDC credentials"
        type: string
        required: true
      report_title:
        description: "Title of the PR comment and step summary"
        type: string
        required: false
        default: "Terragrunt plan"
      terraform_version:
        description: "Terraform version (default: from the repo's .tool-versions)"
        type: string
        required: false
        default: ""
      terragrunt_version:
        description: "Terragrunt version, e.g. 1.2.2 (default: from the repo's .tool-versions)"
        type: string
        required: false
        default: ""
    secrets:
      aws_role_arn:
        description: "Read-only plan role to assume via GitHub OIDC (a secret, so its account ID is masked)"
        required: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The repo's .tool-versions is the one place versions are set; its dev image and
      # root.hcl read the same file, so local runs and CI always match.
      - name: Read tool versions
        id: versions
        env:
          TERRAFORM: ${{ inputs.terraform_version }}
          TERRAGRUNT: ${{ inputs.terragrunt_version }}
        run: |
          set -euo pipefail
          from_file() { awk -v tool="$1" '$1 == tool {print $2}' .tool-versions 2>/dev/null || true; }
          terraform=${TERRAFORM:-$(from_file terraform)}
          terragrunt=${TERRAGRUNT:-$(from_file terragrunt)}
          if [[ -z "$terraform" || -z "$terragrunt" ]]; then
            echo "::error::Set terraform and terragrunt in .tool-versions (or pass the inputs)"
            exit 1
          fi
          echo "terraform=$terraform" >> "$GITHUB_OUTPUT"
          echo "terragrunt=${terragrunt#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        env:
          VERSION: ${{ steps.versions.outputs.terragrunt }}
        run: |
          set -euo pipefail
          base="https://github.com/gruntwork-io/terragrunt/releases/download/v${VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/terragrunt_linux_amd64"
          curl -fsSLO "$base/SHA256SUMS"
          grep " terragrunt_linux_amd64\$" SHA256SUMS | sha256sum -c -
          install -m 0755 terragrunt_linux_amd64 /usr/local/bin/terragrunt
          terragrunt --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: gha-terragrunt-plan
          mask-aws-account-id: true

      # Full output goes to a file on the runner, never to the log. A failed stack logs only
      # Terraform's one-line "Error:" summaries, with any 12-digit number redacted.
      - name: Plan every stack
        id: plan
        env:
          WORKING_DIR: ${{ inputs.terragrunt_working_dir }}
          TG_NON_INTERACTIVE: "true"
          TG_NO_COLOR: "true"
          TF_IN_AUTOMATION: "true"
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugins
        run: |
          set -uo pipefail
          plans="$RUNNER_TEMP/terragrunt-plans"
          mkdir -p "$plans" "$TF_PLUGIN_CACHE_DIR"
          : > "$plans/index.tsv"
          failed=0

          mapfile -t stacks < <(find "$WORKING_DIR" -name terragrunt.hcl -not -path '*/.terragrunt-cache/*' -printf '%h\n' | sort)
          if (( ${#stacks[@]} == 0 )); then
            echo "::error::No terragrunt.hcl found under $WORKING_DIR"
            exit 1
          fi

          for dir in "${stacks[@]}"; do
            stack="${dir#"$WORKING_DIR"/}"
            name="$(printf '%s' "$stack" | tr -c 'A-Za-z0-9._-' '_')"
            log="$plans/$name.log"
            if (cd "$dir" \
                && terragrunt plan -input=false -no-color -out="$plans/$name.tfplan" \
                && terragrunt show -json "$plans/$name.tfplan" > "$plans/$name.json") > "$log" 2>&1; then
              echo "planned  $stack"
              printf '%s\tok\t%s\n' "$stack" "$plans/$name.json" >> "$plans/index.tsv"
            else
              failed=1
              echo "::group::FAILED   $stack"
              grep -oE '(Error|ERROR):? .*' "$log" | sed -E 's/[0-9]{12}/************/g' | sort -u | head -20
              echo "::endgroup::"
              printf '%s\tfailed\t\n' "$stack" >> "$plans/index.tsv"
            fi
            rm -f "$plans/$name.tfplan"
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      # The report action lives in this repo, at the commit this workflow runs from.
      - name: Checkout shared-workflows
        if: ${{ !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows

      - name: Build report
        if: ${{ !cancelled() }}
        uses: ./.shared-workflows/.github/actions/terragrunt-plan-report
        with:
          title: ${{ inputs.report_title }}
          plan_index_tsv: ${{ runner.temp }}/terragrunt-plans/index.tsv
          out_markdown: ${{ runner.temp }}/terragrunt-plan.md

      - name: Remove plan files
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/terragrunt-plans"

      - name: Step summary
        if: ${{ !cancelled() }}
        run: cat "$RUNNER_TEMP/terragrunt-plan.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: ./.shared-workflows/.github/actions/comment-pr
        with:
          comment_name: terragrunt-plan
          body_file: ${{ runner.temp }}/terragrunt-plan.md
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if any stack failed to plan
        if: ${{ steps.plan.outputs.failed == '1' }}
        run: exit 1
