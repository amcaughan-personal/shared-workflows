name: python-checks

# Lint, format-check and test a uv-managed Python project.
#
#   jobs:
#     python:
#       uses: amcaughan-personal/shared-workflows/.github/workflows/python-checks.yml@<commit sha on main>

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory containing pyproject.toml and uv.lock"
        type: string
        required: false
        default: "."
      python_version:
        description: "Python version to test with (default: the repo's .python-version, as uv reads it)"
        type: string
        required: false
        default: ""
      pytest_args:
        description: "Extra arguments for pytest"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ inputs.python_version }}
          enable-cache: true

      - name: Install dependencies (from uv.lock)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        env:
          PYTEST_ARGS: ${{ inputs.pytest_args }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # word-splitting of extra args is intended
          uv run pytest $PYTEST_ARGS
