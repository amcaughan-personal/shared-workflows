name: security-gitleaks

on:
  workflow_call:
    inputs:
      gitleaks_version:
        description: "Gitleaks version to install (e.g. 8.30.0)"
        type: string
        required: false
        default: "8.30.1"
      artifact_name:
        description: "Artifact name for SARIF output"
        type: string
        required: false
        default: "sarif-gitleaks"
      sarif_filename:
        description: "SARIF filename (within out/)"
        type: string
        required: false
        default: "gitleaks.sarif"
      redact:
        description: "Redact secrets in output"
        type: boolean
        required: false
        default: true
      fail_on_findings:
        description: "Fail the job if leaks are found"
        type: boolean
        required: false
        default: true
      scan_history:
        description: "If true, scan git history; if false, scan working tree only"
        type: boolean
        required: false
        default: true
      gitleaks_args:
        description: "Extra args passed to gitleaks"
        type: string
        required: false
        default: ""
    outputs:
      artifact_name:
        value: ${{ jobs.gitleaks.outputs.artifact_name }}
      sarif_path:
        value: ${{ jobs.gitleaks.outputs.sarif_path }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.out.outputs.artifact_name }}
      sarif_path: ${{ steps.out.outputs.sarif_path }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (release binary, checksum-verified)
        shell: bash
        env:
          VERSION: ${{ inputs.gitleaks_version }}
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (SARIF)
        id: run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
      
          set +e
      
          if [[ "${{ inputs.scan_history }}" == "true" ]]; then
            # history scan (commits)
            cmd=(gitleaks git
              --report-format sarif
              --report-path "out/${{ inputs.sarif_filename }}"
              --no-banner
            )
          else
            # working tree scan only (no git history)
            cmd=(gitleaks detect
              --no-git
              --source .
              --report-format sarif
              --report-path "out/${{ inputs.sarif_filename }}"
              --no-banner
            )
          fi
      
          if [[ "${{ inputs.redact }}" == "true" ]]; then
            cmd+=(--redact)
          fi
      
          if [[ -n "${{ inputs.gitleaks_args }}" ]]; then
            extra=(${{ inputs.gitleaks_args }})
            cmd+=("${extra[@]}")
          fi
      
          "${cmd[@]}"
          rc=$?
          set -e
      
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
      
      
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: out/${{ inputs.sarif_filename }}
          if-no-files-found: error
          retention-days: 14

      - name: Expose outputs
        id: out
        shell: bash
        run: |
          echo "artifact_name=${{ inputs.artifact_name }}" >> "$GITHUB_OUTPUT"
          echo "sarif_path=out/${{ inputs.sarif_filename }}" >> "$GITHUB_OUTPUT"

      - name: Fail if findings (optional)
        if: ${{ inputs.fail_on_findings }}
        shell: bash
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        run: exit "$EXIT_CODE"
