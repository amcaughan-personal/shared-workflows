name: "setup-terragrunt"
description: "Install Terraform and Terragrunt at the repo's .tool-versions versions (Terragrunt checksum-verified, cached, downloads retried)"

inputs:
  terraform_version:
    description: "Terraform version (default: from .tool-versions)"
    required: false
    default: ""
  terragrunt_version:
    description: "Terragrunt version, e.g. 1.2.2 (default: from .tool-versions)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # The repo's .tool-versions is the one place versions are set; its dev image and
    # root.hcl read the same file, so local runs and CI always match.
    - name: Read tool versions
      id: versions
      shell: bash
      env:
        TERRAFORM: ${{ inputs.terraform_version }}
        TERRAGRUNT: ${{ inputs.terragrunt_version }}
      run: |
        set -euo pipefail
        from_file() { awk -v tool="$1" '$1 == tool {print $2}' .tool-versions 2>/dev/null || true; }
        terraform=${TERRAFORM:-$(from_file terraform)}
        terragrunt=${TERRAGRUNT:-$(from_file terragrunt)}
        if [[ -z "$terraform" || -z "$terragrunt" ]]; then
          echo "::error::Set terraform and terragrunt in .tool-versions (or pass the inputs)"
          exit 1
        fi
        echo "terraform=$terraform" >> "$GITHUB_OUTPUT"
        echo "terragrunt=${terragrunt#v}" >> "$GITHUB_OUTPUT"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.versions.outputs.terraform }}
        terraform_wrapper: false

    - name: Cache Terragrunt
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/terragrunt-bin
        key: terragrunt-${{ steps.versions.outputs.terragrunt }}-${{ runner.os }}-${{ runner.arch }}

    # GitHub release downloads fail now and then (403s, resets), so retry them. The
    # checksum is checked on download; a cache hit is a binary that passed it.
    - name: Download Terragrunt
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        VERSION: ${{ steps.versions.outputs.terragrunt }}
      run: |
        set -euo pipefail
        base="https://github.com/gruntwork-io/terragrunt/releases/download/v${VERSION}"
        mkdir -p "$RUNNER_TEMP/terragrunt-bin"
        cd "$RUNNER_TEMP/terragrunt-bin"
        fetch() { curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$1"; }
        fetch "$base/terragrunt_linux_amd64"
        fetch "$base/SHA256SUMS"
        grep " terragrunt_linux_amd64\$" SHA256SUMS | sha256sum -c -
        rm SHA256SUMS

    - name: Install Terragrunt
      shell: bash
      run: |
        set -euo pipefail
        install -m 0755 "$RUNNER_TEMP/terragrunt-bin/terragrunt_linux_amd64" /usr/local/bin/terragrunt
        terragrunt --version
