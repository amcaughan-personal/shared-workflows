name: "terragrunt-plan-report"
description: "Markdown report of Terraform plan JSON files, with resource addresses and types only (safe for public PRs)"

inputs:
  title:
    description: "Report title"
    required: false
    default: "Terragrunt plan"
  plan_index_tsv:
    description: "TSV with one line per stack: stack path, status (ok/failed), plan JSON path"
    required: true
  out_markdown:
    description: "Path to write the markdown report"
    required: true

runs:
  using: "composite"
  steps:
    - name: Generate Terragrunt plan report
      shell: bash
      env:
        TITLE: ${{ inputs.title }}
        INDEX: ${{ inputs.plan_index_tsv }}
        OUT: ${{ inputs.out_markdown }}
      run: |
        set -euo pipefail
        python3 "${{ github.action_path }}/terragrunt_plan_report.py" \
          --title "$TITLE" --plan-index-tsv "$INDEX" --out-markdown "$OUT"
